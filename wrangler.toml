name = "intranet-portal"
main = "worker/index.js"
compatibility_date = "2025-06-01"

# Generate the static site before deploying. wrangler runs this on
# `wrangler deploy`, `wrangler dev` and `wrangler versions upload`, which is
# what Cloudflare Workers Builds invokes in CI. Without it the _site/ assets
# directory (git-ignored) would not exist and the deploy would fail.
[build]
command = "npm run build"

# Serve the Eleventy build output as static assets, routed through the Worker
# so we can layer on security headers (see worker/index.js).
[assets]
directory = "./_site"
binding = "ASSETS"
not_found_handling = "404-page"

# Cloudflare Access JWT verification (see worker/access.js).
#
# When both vars are set the Worker requires and verifies the Access token on
# every request; leave them unset for local `wrangler dev` to skip enforcement.
# Neither value is a secret (the AUD tag is an identifier, not a key), so plain
# vars are fine — set them per-environment to your own values:
#
#   - ACCESS_TEAM_DOMAIN: your Access team domain, without scheme,
#       e.g. "your-team.cloudflareaccess.com"
#   - ACCESS_AUD: this application's Audience (AUD) tag, copied from the
#       Access application's "Overview" tab in the Zero Trust dashboard.
[vars]
ACCESS_TEAM_DOMAIN = ""
ACCESS_AUD = ""
